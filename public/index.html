<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QVAC Tweet Length Trimmer</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #f4f6f8;
    font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    color: #1f2937;
    display: flex;
    justify-content: center;
    padding: 40px 20px;
  }
  .wrap { width: 100%; max-width: 560px; }
  h1 { font-size: 1.5rem; margin: 0 0 6px; }
  .subtitle { color: #6b7280; margin-bottom: 20px; font-size: 0.9rem; }
  .card {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    padding: 24px;
  }
  textarea {
    width: 100%;
    min-height: 140px;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #d1d5db;
    font-family: inherit;
    font-size: 0.95rem;
    resize: vertical;
    margin-bottom: 12px;
  }
  .limit-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .limit-row label { font-size: 0.88rem; color: #4b5563; }
  input[type=number] {
    width: 110px;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #d1d5db;
    font-family: inherit;
    font-size: 0.95rem;
  }
  button.action {
    padding: 10px 22px;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    background: #0ea5e9;
    color: #fff;
  }
  button.action:disabled { opacity: 0.5; cursor: not-allowed; }
  .status { margin-top: 12px; font-size: 0.85rem; color: #6b7280; min-height: 1.2em; }
  .result-box {
    margin-top: 18px;
    padding: 16px;
    background: #ecfeff;
    border: 1px solid #a5f3fc;
    border-radius: 10px;
    display: none;
  }
  .result-body { font-size: 1rem; line-height: 1.6; color: #1f2937; white-space: pre-wrap; }
  .stats { margin-top: 10px; font-size: 0.8rem; color: #6b7280; }
  .stats.ok { color: #059669; }
  .footer-note { color: #9ca3af; font-size: 0.78rem; margin-top: 20px; text-align: center; }
  .spinner {
    display: inline-block;
    width: 12px; height: 12px;
    border: 2px solid #cffafe;
    border-top-color: #0ea5e9;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="wrap">
    <h1>QVAC Tweet Length Trimmer</h1>
    <p class="subtitle">Paste text and a character limit, get it trimmed to fit. 100% on-device.</p>

    <div class="card">
      <textarea id="mainInput" placeholder="Paste the text you want trimmed..."></textarea>
      <div class="limit-row">
        <label for="limitInput">Character limit</label>
        <input type="number" id="limitInput" value="280" min="10" max="2000" />
      </div>
      <button class="action" id="generateBtn">Trim It</button>
      <div class="status" id="status"></div>
      <div class="result-box" id="resultBox">
        <div class="result-body" id="resultBody"></div>
        <div class="stats" id="stats"></div>
      </div>
    </div>

    <p class="footer-note">Everything runs locally on your machine. No text ever leaves this device.</p>
  </div>

  <script>
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    const mainInput = document.getElementById('mainInput');
    const limitInput = document.getElementById('limitInput');
    const generateBtn = document.getElementById('generateBtn');
    const status = document.getElementById('status');
    const resultBox = document.getElementById('resultBox');
    const resultBody = document.getElementById('resultBody');
    const stats = document.getElementById('stats');

    async function generate() {
      const value = mainInput.value.trim();
      const limit = Number(limitInput.value);
      if (!value || !limit) return;
      generateBtn.disabled = true;
      resultBox.style.display = 'none';
      status.innerHTML = '<span class="spinner"></span>Trimming...';

      try {
        const res = await fetch('/api/trim', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: value, limit }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        status.textContent = '';
        resultBody.textContent = data.trimmed;
        const fits = data.length <= data.limit;
        stats.className = 'stats' + (fits ? ' ok' : '');
        stats.textContent = data.length + ' / ' + data.limit + ' characters' + (fits ? ' (fits)' : '');
        resultBox.style.display = 'block';
      } catch (err) {
        status.textContent = 'Error: ' + err.message;
      } finally {
        generateBtn.disabled = false;
      }
    }

    generateBtn.addEventListener('click', generate);
  </script>
</body>
</html>
